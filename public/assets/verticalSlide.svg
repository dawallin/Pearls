<svg width="256" height="1024" viewBox="0 0 256 1024"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Symmetric rounded rail gradient: dark edges, bright center -->
    <linearGradient id="railWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7a431f"/>
      <stop offset="8%"   stop-color="#b56f37"/>
      <stop offset="22%"  stop-color="#e0a766"/>
      <stop offset="50%"  stop-color="#d79855"/>
      <stop offset="78%"  stop-color="#e0a766"/>
      <stop offset="92%"  stop-color="#b56f37"/>
      <stop offset="100%" stop-color="#7a431f"/>
    </linearGradient>

    <filter id="woodTextureBlend" filterUnits="objectBoundingBox" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.18 0.85" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="noiseSoft">
        <feFuncR type="gamma" amplitude="1" exponent="1.35" offset="0"/>
        <feFuncG type="gamma" amplitude="1" exponent="1.35" offset="0"/>
        <feFuncB type="gamma" amplitude="1" exponent="1.35" offset="0"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="noiseSoft" mode="multiply"/>
    </filter>

    <clipPath id="railClip">
      <rect x="36" y="0" width="184" height="1024" rx="6" ry="6"/>
    </clipPath>

    <filter id="softStripBlur" x="-200%" y="-5%" width="500%" height="110%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Main vertical rail body: transparent background -->
  <rect x="36" y="0" width="184" height="1024" rx="6" ry="6"
        fill="url(#railWood)"/>

  <!-- Texture only on wood -->
  <g clip-path="url(#railClip)" opacity="0.45">
    <rect x="36" y="0" width="184" height="1024"
          fill="url(#railWood)"
          filter="url(#woodTextureBlend)"/>
  </g>

  <!-- Symmetric ambient edge depth on both sides -->
  <g clip-path="url(#railClip)">
    <rect x="38" y="0" width="9" height="1024"
          fill="#000000" opacity="0.10" filter="url(#softStripBlur)"/>
    <rect x="209" y="0" width="9" height="1024"
          fill="#000000" opacity="0.10" filter="url(#softStripBlur)"/>
  </g>

  <!-- LEFT groove: outer light, inner dark -->
  <rect x="42" y="0" width="7" height="1024"
        fill="#f5c993" opacity="0.62"/>
  <rect x="50" y="0" width="4" height="1024"
        fill="#6e3c1d" opacity="0.34"/>

  <!-- RIGHT groove: mirrored but same strength -->
  <rect x="207" y="0" width="7" height="1024"
        fill="#f5c993" opacity="0.62"/>
  <rect x="202" y="0" width="4" height="1024"
        fill="#6e3c1d" opacity="0.34"/>

  <!-- Subtle symmetric inner bevels -->
  <rect x="58" y="0" width="3" height="1024"
        fill="#ffffff" opacity="0.06"/>
  <rect x="195" y="0" width="3" height="1024"
        fill="#ffffff" opacity="0.06"/>

  <!-- Vertical wood grain -->
  <g opacity="0.16" stroke-linecap="round">
    <path d="M 92 40 C 82 170, 104 270, 92 420 S 82 720, 94 980"
          stroke="#7a451f" stroke-width="3" fill="none"/>
    <path d="M 126 20 C 116 180, 134 340, 124 520 S 112 780, 128 1010"
          stroke="#f0bd7b" stroke-width="2" fill="none"/>
    <path d="M 162 90 C 150 260, 170 420, 160 610 S 150 820, 162 1000"
          stroke="#7a451f" stroke-width="2" fill="none"/>
  </g>

</svg>
