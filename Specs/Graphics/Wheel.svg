
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024"
     viewBox="47 47 306 306">

  <defs>

    <!-- Wood shading -->
    <radialGradient id="wood" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#e2c88f"/>
      <stop offset="22%" stop-color="#d9b777"/>
      <stop offset="45%" stop-color="#cfaa68"/>
      <stop offset="68%" stop-color="#bf914f"/>
      <stop offset="86%" stop-color="#a7773f"/>
      <stop offset="100%" stop-color="#8e6332"/>
    </radialGradient>

    <!-- Very lightweight texture -->
    <filter id="woodNoise">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.8 0.18"
                    numOctaves="2"
                    seed="7"
                    result="n"/>
      <feColorMatrix in="n"
                     type="saturate"
                     values="0"/>
      <feBlend in="SourceGraphic"
               in2="n"
               mode="multiply"/>
    </filter>

    <!-- Highlight -->
    <radialGradient id="highlight" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- black backing -->
  <circle cx="200" cy="200" r="150"
          fill="#1a1a1a"/>

  <!-- wood disk -->
  <circle cx="200" cy="200" r="150"
          fill="url(#wood)"
          filter="url(#woodNoise)"/>

  <!-- highlight -->
  <circle cx="200" cy="165" r="130"
          fill="url(#highlight)"/>

  <!-- U cutouts -->
  <g fill="#1a1a1a">

    <!-- top -->
    <circle cx="200" cy="88.8" r="32.8"/>
    <rect x="167.2" y="56" width="65.6" height="32.8"/>

    <!-- top-right -->
    <g transform="rotate(45 200 200)">
      <circle cx="200" cy="88.8" r="32.8"/>
      <rect x="167.2" y="56" width="65.6" height="32.8"/>
    </g>

    <!-- right -->
    <g transform="rotate(90 200 200)">
      <circle cx="200" cy="88.8" r="32.8"/>
      <rect x="167.2" y="56" width="65.6" height="32.8"/>
    </g>

    <!-- bottom-right -->
    <g transform="rotate(135 200 200)">
      <circle cx="200" cy="88.8" r="32.8"/>
      <rect x="167.2" y="56" width="65.6" height="32.8"/>
    </g>

    <!-- bottom -->
    <g transform="rotate(180 200 200)">
      <circle cx="200" cy="88.8" r="32.8"/>
      <rect x="167.2" y="56" width="65.6" height="32.8"/>
    </g>

    <!-- bottom-left -->
    <g transform="rotate(225 200 200)">
      <circle cx="200" cy="88.8" r="32.8"/>
      <rect x="167.2" y="56" width="65.6" height="32.8"/>
    </g>

    <!-- left -->
    <g transform="rotate(270 200 200)">
      <circle cx="200" cy="88.8" r="32.8"/>
      <rect x="167.2" y="56" width="65.6" height="32.8"/>
    </g>

    <!-- top-left -->
    <g transform="rotate(315 200 200)">
      <circle cx="200" cy="88.8" r="32.8"/>
      <rect x="167.2" y="56" width="65.6" height="32.8"/>
    </g>

  </g>

  <!-- dimples -->
  <g fill="#000000">

    <circle cx="200" cy="88.8" r="23.6"/>

    <circle cx="278.63" cy="121.37" r="23.6"/>
    <circle cx="311.2" cy="200" r="23.6"/>
    <circle cx="278.63" cy="278.63" r="23.6"/>
    <circle cx="200" cy="311.2" r="23.6"/>
    <circle cx="121.37" cy="278.63" r="23.6"/>
    <circle cx="88.8" cy="200" r="23.6"/>
    <circle cx="121.37" cy="121.37" r="23.6"/>

  </g>

</svg>
